name: AppImage

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: appimage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  appimage:
    # An older Ubuntu, so the AppImage runs on older distributions too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config libfuse2 \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev \
            wayland-protocols libdecor-0-dev libegl-dev libgl-dev libdrm-dev \
            libgbm-dev libasound2-dev libpulse-dev libudev-dev

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DADDERALL_BUILD_TESTS=OFF
          cmake --build build

      - name: Assemble the AppDir
        run: |
          A=AppDir
          mkdir -p $A/usr/bin
          cp build/adderall $A/usr/bin/
          cp -r data $A/usr/bin/data
          cp packaging/appimage/AppRun $A/AppRun
          cp packaging/appimage/adderall.desktop packaging/appimage/adderall.svg $A/
          strip $A/usr/bin/adderall

      - name: Build the AppImage
        run: |
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir Adderall-0.2.0-x86_64.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: Adderall-0.2.0-x86_64.AppImage

  publish:
    # Commits the AppImage to downloads/ on dev so the README can link to it
    # directly (no GitHub login needed). Pushes by GITHUB_TOKEN do not start
    # new workflow runs.
    if: github.ref == 'refs/heads/dev'
    needs: appimage
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Commit the AppImage
        run: |
          mkdir -p downloads
          rm -f downloads/Adderall-*.AppImage
          cp dist/Adderall-*.AppImage downloads/
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add downloads
          git diff --cached --quiet || git commit -m "Update AppImage [skip ci]"
          git pull --rebase origin dev
          git push origin dev
